<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a2a"><meta name="description" content="Gestão de obras - Tony Eletricista"><title>Tony Eletricista | Gestão de Obras</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<script>
(function(){
  var admLogin='tony', admSenha='TONY123';
  try{var raw=localStorage.getItem('tony-db');
    if(raw){var d=JSON.parse(raw);if(d&&d.config){if(d.config.adminLogin)admLogin=d.config.adminLogin;if(d.config.adminSenha)admSenha=d.config.adminSenha}}
  }catch(e){}
  function diz(m){var a=document.getElementById('aviso');if(a){a.textContent=m;a.classList.remove('hidden')}}
  window.__loginRapido=function(){
    var u=(document.getElementById('usuario')||{}).value||'';
    var s=(document.getElementById('senha')||{}).value||'';
    u=u.trim().toLowerCase();
    if(!u||!s){diz('Preencha o login e a senha.');return}
    var clientes=[];
    try{var raw=localStorage.getItem('tony-db');if(raw){var d=JSON.parse(raw);clientes=(d&&d.clientes)||[]}}catch(e){}
    var ok=(u===String(admLogin).toLowerCase()&&s===admSenha),cliente=null;
    if(!ok){for(var i=0;i<clientes.length;i++){var c=clientes[i];
      if(String(c.login||'').toLowerCase()===u&&String(c.senha)===s){cliente=c;ok=true;break}}}
    if(!ok){document.getElementById('senha').value='';diz('Login ou senha inválidos.');return}
    diz('');var a=document.getElementById('aviso');if(a)a.classList.add('hidden');
    if(window.__entrar){window.__entrar(cliente?cliente.id:null)}
    else{diz('Aplicativo ainda carregando. Aguarde um instante e toque em Entrar de novo.')}
  };
  window.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('entrar');
    if(b)b.onclick=function(ev){if(ev&&ev.preventDefault)ev.preventDefault();window.__loginRapido()};
    var sn=document.getElementById('senha');
    if(sn)sn.onkeydown=function(e){if(e.key==='Enter')window.__loginRapido()};
  });
  if('serviceWorker' in navigator){
    try{navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf('/tony-eletricista-obras/')>=0)r.unregister()})}).catch(function(){});}catch(e){}
    try{if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf('tony')===0)caches.delete(k)})}).catch(function(){})}}catch(e){}
  }
})();
</script>
</head><body><div id="login" class="login"><div class="login-card"><div class="bolt">⚡</div><h1>TONY <span>ELETRICISTA</span></h1><p>Gestão de obras com segurança e qualidade</p><label for="usuario">Login</label><input id="usuario" type="text" placeholder="Digite seu login" autocapitalize="none" autocomplete="username"><label for="senha">Senha</label><input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password"><button id="entrar" type="button">Entrar</button><p id="aviso" class="aviso hidden"></p></div></div><div id="app" class="hidden"><div id="overlay" class="overlay hidden"></div><aside><div class="brand"><b>⚡ TONY</b><span>ELETRICISTA</span></div><button id="fecharMenu" class="close-menu" aria-label="Fechar menu">✕</button><nav id="nav"></nav><button class="logout" id="sair">Sair</button></aside><main><header><button id="menu" aria-label="Abrir menu">☰</button><div class="header-copy"><h2 id="titulo">Painel</h2><p id="subtitulo">Controle profissional das suas obras</p></div><button id="backup" class="outline">Exportar backup</button></header><section id="conteudo"></section></main></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="app.js"></script></body></html>
